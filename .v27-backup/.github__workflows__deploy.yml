name: Deploy VitePress site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Restore generated media cache
        uses: actions/cache@v4
        with:
          path: |
            docs/public/_media
            .vitepress/cache/media-manifest.json
          key: media-${{ runner.os }}-${{ hashFiles('docs/**', 'media.config.mjs', 'tools/media-pipeline.mjs') }}
          restore-keys: |
            media-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with VitePress
        run: npm run docs:build
        env:
          NODE_ENV: production
          VITEPRESS_BASE: /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
